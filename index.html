<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Martina Treino — Julio 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --bg: #f3e7d0;
    --surface: #fbf3e2;
    --surface-2: #f2e4c3;
    --line: #d9c49a;
    --text: #4a2e21;
    --text-dim: #8a715a;
    --accent: #9c2b2b;
    --accent-dim: #c25a5a;
    --accent-ink: #fdf4e8;
    --danger: #b5423f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Quicksand',sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:40px;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 30px, rgba(156,43,43,.07) 31px),
      radial-gradient(circle at 90% 0%, #eed9ae55 0%, transparent 40%);
  }

  header{
    padding:26px 18px 14px;
    position:relative;
    background:linear-gradient(180deg, var(--bg) 75%, transparent);
  }
  .heart-doodle{ position:absolute; }
  .heart-1{ top:6px; right:52px; width:34px; transform:rotate(-8deg); }
  .heart-2{ top:34px; right:20px; width:22px; transform:rotate(10deg); }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:2px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:38px; letter-spacing:.01em;
    margin:0; line-height:1; color:var(--accent);
    text-shadow: 1px 1px 0 rgba(0,0,0,.05);
  }
  .sub{color:var(--text-dim); font-size:13px; margin-top:6px; letter-spacing:.02em;}

  .weeks{
    display:flex; gap:8px; overflow-x:auto; padding:16px 18px 4px;
    scrollbar-width:none;
  }
  .weeks::-webkit-scrollbar{display:none;}
  .week-pill{
    flex:0 0 auto; padding:9px 16px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--text-dim); font-weight:600; font-size:14px;
    cursor:pointer; white-space:nowrap;
  }
  .week-pill.active{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  }

  .day-toggle{
    display:flex; margin:14px 18px 6px; background:var(--surface);
    border-radius:14px; padding:4px; border:1px solid var(--line);
  }
  .day-btn{
    flex:1; text-align:center; padding:11px 0; border-radius:10px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:15px; color:var(--text-dim); cursor:pointer;
    letter-spacing:.02em;
  }
  .day-btn.active{ background:var(--accent); color:var(--accent-ink); }

  main{padding:8px 18px 10px;}

  .day-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:20px; color:var(--accent);
    margin:6px 2px 12px;
  }

  .section-title{
    font-family:'Baloo 2', sans-serif;
    font-size:13px; color:var(--accent); text-transform:uppercase;
    letter-spacing:.09em; margin:18px 2px 8px; font-weight:700;
  }

  .cardio-note{
    font-size:13px; color:var(--text-dim); margin:14px 2px 4px; padding:10px 12px;
    background:var(--surface); border-radius:16px; border:1px dashed var(--line);
  }

  .exercise{
    background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:14px 14px 12px; margin-bottom:12px;
    box-shadow: 2px 3px 0 rgba(156,43,43,.08);
  }
  .ex-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    margin-bottom:10px;
  }
  .ex-name{font-weight:700; font-size:15px; line-height:1.25;}
  .ex-meta{font-size:11px; color:var(--accent); font-weight:700; white-space:nowrap;}

  .sets-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(64px,1fr));
    gap:8px;
  }
  .set-cell{display:flex; flex-direction:column; gap:4px;}
  .set-label{font-size:10px; color:var(--text-dim); text-align:center;}
  .set-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; color:var(--text); text-align:center; font-size:15px;
    font-weight:600; padding:9px 2px; -moz-appearance:textfield;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .set-input:focus{ outline:none; border-color:var(--accent); }

  .muscle-tag{
    display:inline-block; font-size:10px; font-weight:700;
    padding:2px 8px; border-radius:999px; margin-bottom:6px;
    background:var(--surface-2); color:var(--text-dim);
    letter-spacing:.04em; text-transform:uppercase;
  }

  footer{
    padding:18px; display:flex; justify-content:space-between; align-items:center;
  }
  .status{font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .clear-btn{
    background:none; border:1px solid var(--line); color:var(--danger);
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:20px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <svg class="heart-doodle heart-1" viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 48 C 8 34, 2 22, 8 13 C 13 5, 24 6, 30 17 C 34 8, 46 4, 53 12 C 60 21, 52 34, 30 48 Z"
          fill="none" stroke="#9c2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg class="heart-doodle heart-2" viewBox="0 0 60 54" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 47 C 10 35, 4 24, 9 15 C 14 7, 25 8, 30 18 C 34 9, 45 6, 51 14 C 57 23, 50 35, 30 47 Z"
          fill="#9c2b2b" opacity="0.9"/>
  </svg>
  <div class="eyebrow">Rutina Gym · Julio 2026</div>
  <h1>Martina Treino</h1>
  <div class="sub">Bajar grasa / tonificación</div>
</header>

<div class="weeks" id="weeks"></div>
<div class="day-toggle" id="dayToggle"></div>
<main id="main"></main>

<footer>
  <div class="status"><span class="dot"></span> <span id="statusText">Guardado en este dispositivo</span></div>
  <button class="clear-btn" id="clearBtn">Borrar esta semana</button>
</footer>

<script>
const ROUTINE = {
  d1: {
    label: "Día 1 · Femorales, Cuádriceps y Glúteos",
    cardio: "Cardio: 15-20' elíptico",
    warmup: "EC: mov. articular + 6' bici",
    core: [
      { name: "Plancha baja", muscle: "Core", reps: ["1'","1'","1'"] },
      { name: "Inferiores rodillas al pecho colgada", muscle: "Core", reps: [20,20,20] },
      { name: "Bolitas con pies en el aire", muscle: "Core", reps: [20,20,20] }
    ],
    exercises: [
      { name: "Peso muerto libre", muscle: "Femorales", reps: [12,12,12,12] },
      { name: "Hip Thrust libre o en máquina", muscle: "Glúteos", reps: [15,15,12,12] },
      { name: "Prensa", muscle: "Cuádriceps", reps: [12,12,12,12] },
      { name: "Estocadas caminando", muscle: "Cuád / Glúteos", reps: [15,15,15,15] },
      { name: "Abductores con espalda apoyada", muscle: "Abductores", reps: [20,20,20,20] }
    ]
  },
  d2: {
    label: "Día 2 · Espalda, Hombros y Tríceps",
    cardio: "Cardio: 15-20' cinta elevada + hipopresivos",
    warmup: "EC: mov. articular",
    core: [
      { name: "Colgada rodillas al pecho con carga", muscle: "Core", reps: [15,15,15] },
      { name: "Plancha lateral (30\" por lado)", muscle: "Core", reps: ["30\"","30\""] }
    ],
    exercises: [
      { name: "Dorsales al pecho", muscle: "Espalda", reps: [15,15,12,12] },
      { name: "Remo a un brazo con mancuernas", muscle: "Espalda", reps: [12,12,12,12] },
      { name: "Press Arnold", muscle: "Hombros", reps: [12,12,12,12] },
      { name: "Francés a un brazo con mancuerna", muscle: "Tríceps", reps: [12,12,12,12] },
      { name: "Extensión de tríceps en polea con soga", muscle: "Tríceps", reps: [15,15,15,15] }
    ]
  }
};

const WEEKS = ["S1","S2","S3","S4"];
let currentWeek = localStorage.getItem("martina:lastWeek") || "S1";
let currentDay  = localStorage.getItem("martina:lastDay")  || "d1";

function storageKey(week, day, section, idx){
  return `martina:${week}:${day}:${section}${idx}`;
}

function renderWeeks(){
  const el = document.getElementById("weeks");
  el.innerHTML = "";
  WEEKS.forEach(w => {
    const pill = document.createElement("div");
    pill.className = "week-pill" + (w === currentWeek ? " active" : "");
    pill.textContent = "Semana " + w.slice(1);
    pill.onclick = () => { currentWeek = w; localStorage.setItem("martina:lastWeek", w); renderAll(); };
    el.appendChild(pill);
  });
}

function renderDayToggle(){
  const el = document.getElementById("dayToggle");
  el.innerHTML = "";
  ["d1","d2"].forEach(d => {
    const btn = document.createElement("div");
    btn.className = "day-btn" + (d === currentDay ? " active" : "");
    btn.textContent = d === "d1" ? "Día 1" : "Día 2";
    btn.onclick = () => { currentDay = d; localStorage.setItem("martina:lastDay", d); renderAll(); };
    el.appendChild(btn);
  });
}

function renderExerciseBlock(exercises, section, sectionTitle){
  const main = document.getElementById("main");

  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = sectionTitle;
  main.appendChild(title);

  exercises.forEach((ex, i) => {
    const card = document.createElement("div");
    card.className = "exercise";

    const tag = document.createElement("div");
    tag.className = "muscle-tag";
    tag.textContent = ex.muscle;
    card.appendChild(tag);

    const head = document.createElement("div");
    head.className = "ex-head";
    head.innerHTML = `<div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.reps.length}×${ex.reps.join('/')}</div>`;
    card.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "sets-grid";

    let saved = [];
    try {
      const raw = localStorage.getItem(storageKey(currentWeek, currentDay, section, i));
      saved = raw ? JSON.parse(raw) : [];
    } catch(e){ saved = []; }

    ex.reps.forEach((rep, si) => {
      const cell = document.createElement("div");
      cell.className = "set-cell";
      const label = document.createElement("div");
      label.className = "set-label";
      label.textContent = `S${si+1} · ${typeof rep === "number" ? rep + "r" : rep}`;
      const input = document.createElement("input");
      input.className = "set-input";
      input.type = "number";
      input.inputMode = "decimal";
      input.placeholder = "kg";
      input.value = saved[si] ?? "";
      input.addEventListener("input", () => saveSet(section, i, si, input.value));
      cell.appendChild(label);
      cell.appendChild(input);
      grid.appendChild(cell);
    });

    card.appendChild(grid);
    main.appendChild(card);
  });
}

function renderMain(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const day = ROUTINE[currentDay];

  const dayLabel = document.createElement("div");
  dayLabel.className = "day-label";
  dayLabel.textContent = day.label;
  main.appendChild(dayLabel);

  if(day.warmup){
    const warm = document.createElement("div");
    warm.className = "cardio-note";
    warm.style.marginTop = "0";
    warm.textContent = day.warmup;
    main.appendChild(warm);
  }

  renderExerciseBlock(day.core, "core", "Core / Activación");
  renderExerciseBlock(day.exercises, "ex", "Bloque principal");

  const cardio = document.createElement("div");
  cardio.className = "cardio-note";
  cardio.textContent = day.cardio;
  main.appendChild(cardio);
}

function saveSet(section, exIndex, setIndex, value){
  const key = storageKey(currentWeek, currentDay, section, exIndex);
  let arr = [];
  try {
    const raw = localStorage.getItem(key);
    arr = raw ? JSON.parse(raw) : [];
  } catch(e){ arr = []; }
  arr[setIndex] = value;
  localStorage.setItem(key, JSON.stringify(arr));
  flashStatus("Guardado ✓");
}

let statusTimer = null;
function flashStatus(msg){
  const el = document.getElementById("statusText");
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = "Guardado en este dispositivo"; }, 1200);
}

document.getElementById("clearBtn").onclick = () => {
  if(!confirm(`¿Borrar todos los pesos de ${currentWeek}?`)) return;
  ["d1","d2"].forEach(day => {
    ROUTINE[day].core.forEach((_, i) => localStorage.removeItem(storageKey(currentWeek, day, "core", i)));
    ROUTINE[day].exercises.forEach((_, i) => localStorage.removeItem(storageKey(currentWeek, day, "ex", i)));
  });
  renderAll();
};

function renderAll(){
  renderWeeks();
  renderDayToggle();
  renderMain();
}

renderAll();
</script>
</body>
</html>
