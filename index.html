<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Martina Treino — Julio 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #121316;
    --surface: #1b1d22;
    --surface-2: #232630;
    --line: #2c2f38;
    --text: #eef0f3;
    --text-dim: #8b8f9c;
    --accent: #c6ff3d;
    --accent-dim: #7a9629;
    --accent-ink: #101204;
    --danger: #ff5c5c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:40px;
  }

  header{
    padding:22px 18px 14px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:4px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px; letter-spacing:.03em; margin:0; line-height:1;
    color:var(--text);
  }
  .sub{color:var(--text-dim); font-size:13px; margin-top:4px;}

  .weeks{
    display:flex; gap:8px; overflow-x:auto; padding:16px 18px 4px;
    scrollbar-width:none;
  }
  .weeks::-webkit-scrollbar{display:none;}
  .week-pill{
    flex:0 0 auto; padding:9px 16px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--text-dim); font-weight:600; font-size:14px;
    cursor:pointer; white-space:nowrap;
  }
  .week-pill.active{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  }

  .day-toggle{
    display:flex; margin:14px 18px 6px; background:var(--surface);
    border-radius:12px; padding:4px; border:1px solid var(--line);
  }
  .day-btn{
    flex:1; text-align:center; padding:10px 0; border-radius:9px;
    font-weight:700; font-size:13px; color:var(--text-dim); cursor:pointer;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .day-btn.active{ background:var(--surface-2); color:var(--accent); }

  main{padding:8px 18px 10px;}

  .day-title{
    font-size:12px; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.08em; margin:18px 2px 8px; font-weight:700;
  }

  .exercise{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:14px 14px 12px; margin-bottom:12px;
  }
  .ex-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    margin-bottom:10px;
  }
  .ex-name{font-weight:700; font-size:15px; line-height:1.25;}
  .ex-meta{font-size:11px; color:var(--accent); font-weight:700; white-space:nowrap;}

  .sets-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(64px,1fr));
    gap:8px;
  }
  .set-cell{display:flex; flex-direction:column; gap:4px;}
  .set-label{font-size:10px; color:var(--text-dim); text-align:center;}
  .set-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; color:var(--text); text-align:center; font-size:15px;
    font-weight:600; padding:9px 2px; -moz-appearance:textfield;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .set-input:focus{ outline:none; border-color:var(--accent); }

  .cardio-note{
    font-size:13px; color:var(--text-dim); margin:14px 2px 4px; padding:10px 12px;
    background:var(--surface); border-radius:10px; border:1px dashed var(--line);
  }

  footer{
    padding:18px; display:flex; justify-content:space-between; align-items:center;
  }
  .status{font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .clear-btn{
    background:none; border:1px solid var(--line); color:var(--danger);
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:8px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Julio 2026</div>
  <h1>Martina Treino</h1>
  <div class="sub">Bajar grasa / tonificación</div>
</header>

<div class="weeks" id="weeks"></div>
<div class="day-toggle" id="dayToggle"></div>

<main id="main"></main>

<footer>
  <div class="status"><span class="dot"></span> <span id="statusText">Guardado en este dispositivo</span></div>
  <button class="clear-btn" id="clearBtn">Borrar esta semana</button>
</footer>

<script>
// ---------- Datos de la rutina ----------
const ROUTINE = {
  d1: {
    label: "Día 1 · Femorales, Cuádriceps y Glúteos",
    cardio: "Cardio: 15-20' elíptico",
    exercises: [
      { name: "Peso muerto libre", reps: [12,12,12,12] },
      { name: "Hip Thrust libre o en máquina", reps: [15,15,12,12] },
      { name: "Sentadilla sumo con mancuerna pesada", reps: [12,12,12,12] },
      { name: "Prensa", reps: [12,12,12,12] },
      { name: "Estocadas caminando", reps: [15,15,15,15] },
      { name: "Abductores con espalda apoyada", reps: [20,20,20,20] },
      { name: "Patada con tobillera", reps: [15,15,15] }
    ]
  },
  d2: {
    label: "Día 2 · Espalda, Hombros y Tríceps",
    cardio: "Cardio: 15-20' cinta elevada + hipopresivos",
    exercises: [
      { name: "Remo a un brazo con mancuernas", reps: [12,12,12,12] },
      { name: "Remo en polea", reps: [12,12,12,12] },
      { name: "Dorsales al pecho", reps: [12,12,12,12] },
      { name: "Pullover en polea", reps: [12,12,12,12] },
      { name: "Press Arnold", reps: [12,12,12,12] },
      { name: "Vuelo lateral", reps: [15,15,15,15] },
      { name: "Press en máquina", reps: [12,12,12,12] },
      { name: "Vuelo frontal", reps: [12,12,12,12] },
      { name: "Francés a un brazo con mancuerna", reps: [12,12,12,12] },
      { name: "Extensión de tríceps en polea con soga", reps: [15,15,15,15] }
    ]
  }
};

const WEEKS = ["S1","S2","S3","S4"];
let currentWeek = localStorage.getItem("martina:lastWeek") || "S1";
let currentDay = localStorage.getItem("martina:lastDay") || "d1";

const weeksEl = document.getElementById("weeks");
const dayToggleEl = document.getElementById("dayToggle");
const mainEl = document.getElementById("main");
const statusText = document.getElementById("statusText");
const clearBtn = document.getElementById("clearBtn");

function storageKey(week, day, exIndex){
  return `martina:${week}:${day}:ex${exIndex}`;
}

function renderWeeks(){
  weeksEl.innerHTML = "";
  WEEKS.forEach(w=>{
    const pill = document.createElement("div");
    pill.className = "week-pill" + (w===currentWeek ? " active" : "");
    pill.textContent = "Semana " + w.slice(1);
    pill.onclick = ()=>{ currentWeek = w; localStorage.setItem("martina:lastWeek", w); renderAll(); };
    weeksEl.appendChild(pill);
  });
}

function renderDayToggle(){
  dayToggleEl.innerHTML = "";
  ["d1","d2"].forEach(d=>{
    const btn = document.createElement("div");
    btn.className = "day-btn" + (d===currentDay ? " active" : "");
    btn.textContent = d === "d1" ? "Día 1" : "Día 2";
    btn.onclick = ()=>{ currentDay = d; localStorage.setItem("martina:lastDay", d); renderAll(); };
    dayToggleEl.appendChild(btn);
  });
}

function renderExercises(){
  mainEl.innerHTML = "";
  const day = ROUTINE[currentDay];

  const title = document.createElement("div");
  title.className = "day-title";
  title.textContent = day.label;
  mainEl.appendChild(title);

  day.exercises.forEach((ex, i)=>{
    const card = document.createElement("div");
    card.className = "exercise";

    const head = document.createElement("div");
    head.className = "ex-head";
    head.innerHTML = `<div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.reps.length}x${ex.reps.join('/')}</div>`;
    card.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "sets-grid";

    let saved = [];
    try{
      const raw = localStorage.getItem(storageKey(currentWeek, currentDay, i));
      saved = raw ? JSON.parse(raw) : [];
    }catch(e){ saved = []; }

    ex.reps.forEach((rep, si)=>{
      const cell = document.createElement("div");
      cell.className = "set-cell";
      const label = document.createElement("div");
      label.className = "set-label";
      label.textContent = `S${si+1} · ${rep}r`;
      const input = document.createElement("input");
      input.className = "set-input";
      input.type = "number";
      input.inputMode = "decimal";
      input.placeholder = "kg";
      input.value = saved[si] ?? "";
      input.addEventListener("input", ()=>{
        saveSet(i, si, input.value);
      });
      cell.appendChild(label);
      cell.appendChild(input);
      grid.appendChild(cell);
    });

    card.appendChild(grid);
    mainEl.appendChild(card);
  });

  const cardioNote = document.createElement("div");
  cardioNote.className = "cardio-note";
  cardioNote.textContent = day.cardio;
  mainEl.appendChild(cardioNote);
}

function saveSet(exIndex, setIndex, value){
  const key = storageKey(currentWeek, currentDay, exIndex);
  let arr = [];
  try{
    const raw = localStorage.getItem(key);
    arr = raw ? JSON.parse(raw) : [];
  }catch(e){ arr = []; }
  arr[setIndex] = value;
  localStorage.setItem(key, JSON.stringify(arr));
  flashStatus("Guardado ✓");
}

let statusTimer = null;
function flashStatus(msg){
  statusText.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ statusText.textContent = "Guardado en este dispositivo"; }, 1200);
}

clearBtn.onclick = ()=>{
  if(!confirm(`¿Borrar todos los pesos cargados de ${currentWeek}?`)) return;
  ["d1","d2"].forEach(day=>{
    ROUTINE[day].exercises.forEach((_, i)=>{
      localStorage.removeItem(storageKey(currentWeek, day, i));
    });
  });
  renderAll();
};

function renderAll(){
  renderWeeks();
  renderDayToggle();
  renderExercises();
}

renderAll();
</script>
</body>
</html>
