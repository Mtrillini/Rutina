<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Luna · Registro de Entreno</title>
<style>
  :root{
    --bg: #0f1410;
    --bg-card: #171d18;
    --bg-card-2: #1c231d;
    --line: #2a332b;
    --ink: #eef0ea;
    --ink-dim: #9aa596;
    --brass: #c99a4b;
    --brass-dim: #8a6c38;
    --moss: #6b8f5a;
    --moss-glow: #8fbf76;
    --express: #c9703f;
    --radius: 14px;
    --mono: 'SF Mono', ui-monospace, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #182018 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: 90px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background: rgba(15,20,16,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 14px;
  }
  .eyebrow{
    font-family: var(--mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--brass);
    margin: 0 0 4px;
  }
  h1{
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sub{
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .status-bar{
    display:flex; align-items:center; gap:8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 10px;
    min-height: 16px;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--moss);
    box-shadow: 0 0 0 0 rgba(111,159,90,0.6);
  }
  .status-dot.pulse{
    animation: pulse 0.9s ease-out;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(143,191,118,0.55);}
    100%{ box-shadow: 0 0 0 9px rgba(143,191,118,0);}
  }

  nav.days{
    display:flex; gap:8px;
    padding: 12px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.days::-webkit-scrollbar{display:none;}
  nav.days button{
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.03em;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    white-space: nowrap;
  }
  nav.days button.active{
    background: var(--moss);
    border-color: var(--moss);
    color: #0f1410;
    font-weight: 700;
  }

  main{ padding: 18px 16px 8px; }

  .day-section{ display:none; }
  .day-section.active{ display:block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .warmup{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass-dim);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .warmup b{ color: var(--ink); font-weight:600; }

  .block-label{
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--brass);
    margin: 22px 2px 10px;
  }
  .block-label:first-of-type{ margin-top: 0; }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 8px;
    margin-bottom: 10px;
  }
  .card.sub-ex{
    margin-left: 14px;
    background: var(--bg-card-2);
  }
  .ex-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap: 10px; margin-bottom: 12px;
  }
  .ex-name{
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.3;
  }
  .card.sub-ex .ex-name{ font-weight: 500; color: var(--ink-dim); }
  .ex-sr{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--brass);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .weeks{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .week-field label{
    display:block;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-dim);
    text-transform:uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .week-field .input-wrap{
    position:relative;
  }
  .week-field input{
    width:100%;
    background: #0f1410;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    padding: 9px 22px 9px 8px;
    text-align:left;
    -moz-appearance: textfield;
  }
  .week-field input::-webkit-outer-spin-button,
  .week-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .week-field input:focus{
    outline:none;
    border-color: var(--moss-glow);
    background: #131a12;
  }
  .week-field .unit{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    font-size: 10px; color: var(--ink-dim); pointer-events:none;
  }
  .week-field input:placeholder-shown + .unit{ opacity: 0.4; }

  .express-toggle{
    display:flex; align-items:center; gap:8px;
    margin: 18px 2px 4px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--express);
  }
  .express-toggle input{ accent-color: var(--express); width:15px; height:15px; }

  .express-block{ display:none; }
  .express-block.show{ display:block; }
  .express-block .card{ border-left: 2px solid var(--express); }
  .express-block .ex-sr{ color: var(--express); }

  .cardio-line{
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(201,112,63,0.08);
    border: 1px dashed rgba(201,112,63,0.35);
    font-size: 12.5px;
    color: #d99a72;
    font-family: var(--mono);
  }

  footer{
    position:fixed; bottom:0; left:0; right:0;
    background: rgba(15,20,16,0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-between; align-items:center;
    font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
  }
  footer button{
    background:none; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 8px; padding: 7px 12px; font-family: var(--mono); font-size: 11px;
  }
  footer button:active{ background: var(--line); }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Registro personal · Mayo 2026</p>
  <h1>Luna — Treino</h1>
  <p class="sub">Cargá el peso usado cada semana. Se guarda solo, en tu cuenta.</p>
  <div class="status-bar"><span class="status-dot" id="statusDot"></span><span id="statusText">Listo</span></div>
</header>

<nav class="days" id="dayNav"></nav>

<main id="main"></main>

<footer>
  <span id="lastSaved">Sin cambios aún</span>
  <button id="resetBtn">Borrar registros</button>
</footer>

<script>
// ---------- DATA MODEL ----------
const DAYS = [
  {
    id: "d1",
    label: "Día 1",
    title: "Femorales y Glúteos",
    warmup: "<b>Entrada en calor</b><br>Mov. articular + 6' bici<br>Zona ½ en SuperSerie: Plancha baja 3x1' · Inferiores rodillas al pecho colgada 3x20 · Bolitas con pies en el aire 3x20",
    blocks: [
      { label: null, exercises: [
        { id:"hipthrust", name:"Hip Thrust libre o en máquina", sr:"4x12/12/10/10" },
        { id:"pmuertopierna", name:"Peso muerto a una pierna con mancuerna", sr:"4x10", sub:true },
        { id:"sentsumo", name:"Sentadilla sumo con mancuerna pesada", sr:"4x12" },
        { id:"abductores1", name:"Abductores con espalda apoyada", sr:"4x20", sub:true },
        { id:"pmuertolibre", name:"Peso muerto libre", sr:"4x12" },
        { id:"aductores1", name:"Aductores en máquina", sr:"4x20", sub:true },
        { id:"patadatobillera", name:"Patada con tobillera (flex/ext/lateral/cruzada)", sr:"3x20/20/20" },
      ]}
    ],
    express: [
      { label:null, exercises: [
        { id:"hipthrust", sr:"4x15/15/12/12" },
        { id:"pmuertopierna", sr:"4x12" },
        { id:"sentsumo", sr:"4x12" },
        { id:"abductores1", sr:"4x15" },
        { id:"pmuertolibre", sr:"4x12" },
        { id:"aductores1", sr:"4x15" },
        { id:"patadatobillera", sr:"3x15/15/15" },
      ]}
    ],
    cardio: "Cardio: 30' en elíptico  ·  Express: 15-20' más intenso"
  },
  {
    id: "d2",
    label: "Día 2",
    title: "Cuádriceps y Espalda",
    warmup: "<b>Entrada en calor (3 series)</b><br>1' plancha baja + 30 mountain climbers + 40\" plancha lateral por lado + 20 bisagras alternadas",
    blocks: [
      { label:"Cuádriceps", exercises: [
        { id:"sentsmith", name:"Sentadilla profunda piernas abiertas en smith", sr:"4x15" },
        { id:"prensa", name:"Prensa", sr:"4x12" },
        { id:"estocadascam", name:"Estocadas caminando", sr:"4x20", sub:true },
        { id:"sillon", name:"Sillón de cuádriceps", sr:"4x15" },
      ]},
      { label:"Espalda", exercises: [
        { id:"remomanc", name:"Remo a un brazo con mancuernas", sr:"4x12" },
        { id:"remopolea", name:"Remo en polea", sr:"4x15", sub:true },
        { id:"dorsales", name:"Dorsales al pecho", sr:"4x15/15/12/12" },
        { id:"pullover", name:"Pullover en polea", sr:"4x15", sub:true },
        { id:"posteriores", name:"Posteriores en máquina", sr:"4x15" },
      ]}
    ],
    express: [
      { label:"Cuádriceps", exercises: [
        { id:"sentsmith", sr:"4x15" },
        { id:"prensa", sr:"4x12" },
        { id:"estocadascam", sr:"4x15" },
        { id:"sillon", sr:"4x12" },
      ]},
      { label:"Espalda", exercises: [
        { id:"remomanc", sr:"4x12" },
        { id:"remopolea", sr:"4x12" },
        { id:"dorsales", sr:"4x15/15/12/12" },
        { id:"pullover", sr:"4x12" },
        { id:"posteriores", sr:"4x12" },
      ]}
    ],
    cardio: "Cardio: 30' cinta elevada + hipopresivos  ·  Express: 15-20'"
  },
  {
    id: "d4",
    label: "Día 4",
    title: "Glúteos / Hombros y Tríceps",
    warmup: "<b>Entrada en calor</b><br>Mov. art + 6' bici<br>Zona ½ en SS: Colgada rodillas al pecho con carga 3x15 · Colgada piernas extendidas sin carga 3x20",
    blocks: [
      { label:"Glúteos", exercises: [
        { id:"estocbulg", name:"Estocadas búlgaras", sr:"4x12" },
        { id:"patlateral", name:"Patadas laterales en máquina o polea", sr:"15", sub:true },
        { id:"abductores2", name:"Abductores con espalda separada", sr:"4x20" },
        { id:"hipthrustbanda", name:"Hip Thrust con barra y banda (normal/bombeado)", sr:"4x15/15" },
        { id:"patpoleabanco", name:"Patada en polea con banco (flex/ext/lateral)", sr:"3x20/20/20" },
      ]},
      { label:"Hombros y Tríceps", exercises: [
        { id:"pressarnold", name:"Press arnold", sr:"4x12" },
        { id:"vuelolateral", name:"Vuelo lateral", sr:"4x15", sub:true },
        { id:"pressmaquina", name:"Press en máquina", sr:"4x12" },
        { id:"vuelofrontal", name:"Vuelo frontal", sr:"4x15", sub:true },
        { id:"francesmanc", name:"Francés a un brazo con mancuerna", sr:"4x12" },
        { id:"francesdisco", name:"Francés con disco", sr:"15", sub:true },
        { id:"extbarrita", name:"Extensión de tríceps en polea con barrita", sr:"4x12" },
        { id:"extsoga", name:"Extensión de tríceps en polea con soga", sr:"4x15", sub:true },
      ]}
    ],
    express: [
      { label:"Glúteos", exercises: [
        { id:"estocbulg", sr:"4x12" },
        { id:"patlateral", sr:"12" },
        { id:"abductores2", sr:"4x15" },
        { id:"hipthrustbanda", sr:"4x15/15" },
        { id:"patpoleabanco", sr:"3x15/15/15" },
      ]},
      { label:"Hombros y Tríceps", exercises: [
        { id:"pressarnold", sr:"4x12" },
        { id:"vuelolateral", sr:"4x12" },
        { id:"pressmaquina", sr:"4x12" },
        { id:"vuelofrontal", sr:"4x12" },
        { id:"francesmanc", sr:"4x12" },
        { id:"francesdisco", sr:"12" },
        { id:"extbarrita", sr:"4x12" },
        { id:"extsoga", sr:"4x12" },
      ]}
    ],
    cardio: "Cardio: 30' en elíptico  ·  Express: 15-20' más intenso"
  }
];

const WEEKS = 4;

// ---------- STORAGE ----------
let dayData = {}; // { d1: { hipthrust: ["", "", "", ""], ... }, ... }
let saveTimer = null;

async function loadAll(){
  for(const day of DAYS){
    try{
      const res = await window.storage.get(`day:${day.id}`, false);
      dayData[day.id] = res && res.value ? JSON.parse(res.value) : {};
    }catch(e){
      dayData[day.id] = {};
    }
  }
}

function scheduleSave(dayId){
  setStatus("Guardando…", false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDay(dayId), 450);
}

async function saveDay(dayId){
  try{
    const result = await window.storage.set(`day:${dayId}`, JSON.stringify(dayData[dayId]), false);
    if(result){
      setStatus("Guardado", true);
      const now = new Date();
      document.getElementById('lastSaved').textContent =
        "Último guardado: " + now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    }else{
      setStatus("Error al guardar", false);
    }
  }catch(e){
    setStatus("Error al guardar", false);
  }
}

function setStatus(text, pulse){
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  dot.classList.remove('pulse');
  if(pulse){ void dot.offsetWidth; dot.classList.add('pulse'); }
}

// ---------- RENDER ----------
function exerciseCard(dayId, ex, srOverride){
  const stored = (dayData[dayId] && dayData[dayId][ex.id]) || ["", "", "", ""];
  const sr = srOverride !== undefined ? srOverride : ex.sr;
  const name = ex.name || "";
  let weeksHtml = "";
  for(let w=0; w<WEEKS; w++){
    weeksHtml += `
      <div class="week-field">
        <label>Sem. ${w+1}</label>
        <div class="input-wrap">
          <input type="number" inputmode="decimal" step="0.5" placeholder="—"
            data-day="${dayId}" data-ex="${ex.id}" data-week="${w}"
            value="${stored[w] || ""}">
          <span class="unit">kg</span>
        </div>
      </div>`;
  }
  return `
    <div class="card ${ex.sub ? 'sub-ex' : ''}">
      <div class="ex-head">
        <div class="ex-name">${ex.sub ? '— ' : ''}${name}</div>
        <div class="ex-sr">${sr}</div>
      </div>
      <div class="weeks">${weeksHtml}</div>
    </div>`;
}

function renderDay(day){
  let html = `<div class="warmup">${day.warmup}</div>`;

  day.blocks.forEach(block => {
    if(block.label) html += `<div class="block-label">${block.label}</div>`;
    block.exercises.forEach(ex => { html += exerciseCard(day.id, ex); });
  });

  html += `<div class="cardio-line">🏃 ${day.cardio}</div>`;

  html += `<label class="express-toggle">
      <input type="checkbox" class="expToggle" data-day="${day.id}">
      ⚡ Mostrar versión express (mismos ejercicios, referencia de reps)
    </label>`;

  html += `<div class="express-block" id="exp-${day.id}">`;
  day.express.forEach((block, bi) => {
    if(block.label) html += `<div class="block-label">${block.label}</div>`;
    block.exercises.forEach(ex => {
      const full = day.blocks.flatMap(b=>b.exercises).find(e=>e.id===ex.id);
      html += exerciseCard(day.id, {...full, sr: ex.sr}, ex.sr);
    });
  });
  html += `</div>`;

  return html;
}

function buildUI(){
  const nav = document.getElementById('dayNav');
  const main = document.getElementById('main');
  nav.innerHTML = "";
  main.innerHTML = "";

  DAYS.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.textContent = day.label;
    btn.className = i === 0 ? 'active' : '';
    btn.dataset.day = day.id;
    btn.onclick = () => switchDay(day.id);
    nav.appendChild(btn);

    const section = document.createElement('section');
    section.className = 'day-section' + (i === 0 ? ' active' : '');
    section.id = `sec-${day.id}`;
    section.innerHTML = `<div class="block-label" style="margin-top:0;font-size:13px;color:var(--ink);letter-spacing:0.02em;text-transform:none;font-family:inherit;font-weight:700;">${day.title}</div>` + renderDay(day);
    main.appendChild(section);
  });

  main.addEventListener('input', onInput);
  main.addEventListener('change', (e) => {
    if(e.target.classList.contains('expToggle')){
      document.getElementById(`exp-${e.target.dataset.day}`).classList.toggle('show', e.target.checked);
    }
  });
}

function onInput(e){
  const t = e.target;
  if(t.tagName !== 'INPUT' || t.type !== 'number') return;
  const { day, ex, week } = t.dataset;
  if(!dayData[day]) dayData[day] = {};
  if(!dayData[day][ex]) dayData[day][ex] = ["", "", "", ""];
  dayData[day][ex][week] = t.value;

  // mirror value into express block input for same exercise, if present
  document.querySelectorAll(`input[data-day="${day}"][data-ex="${ex}"][data-week="${week}"]`)
    .forEach(el => { if(el !== t) el.value = t.value; });

  scheduleSave(day);
}

function switchDay(dayId){
  document.querySelectorAll('nav.days button').forEach(b => b.classList.toggle('active', b.dataset.day === dayId));
  document.querySelectorAll('.day-section').forEach(s => s.classList.toggle('active', s.id === `sec-${dayId}`));
}

// ---------- RESET ----------
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm("¿Borrar todos los pesos guardados? Esta acción no se puede deshacer.")) return;
  setStatus("Borrando…", false);
  try{
    for(const day of DAYS){
      await window.storage.delete(`day:${day.id}`, false);
      dayData[day.id] = {};
    }
    buildUI();
    setStatus("Registros borrados", true);
    document.getElementById('lastSaved').textContent = "Sin cambios aún";
  }catch(e){
    setStatus("Error al borrar", false);
  }
});

// ---------- INIT ----------
(async function init(){
  setStatus("Cargando…", false);
  await loadAll();
  buildUI();
  setStatus("Listo", true);
})();
</script>
</body>
</html>
